name: Selenium Grid tests

on:
 push:
 pull_request:
 workflow_dispatch:

permissions:
 contents: read

jobs:
 grid-tests:
   runs-on: ubuntu-latest
   timeout-minutes: 30
   env:
     selenium_grid_url: http://localhost:4444

   steps:
     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

     - name: Set up Java
       uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #v6.2.0
       with:
         distribution: zulu
         java-version: '21'
         cache: maven

     - name: Start Selenium Grid
       run: docker compose up --wait --detach

     - name: Run tests against Grid
       timeout-minutes: 5
       run: |
           curl -fsS http://localhost:4444/status
           export selenium_grid_url=http://localhost:4444
           mvn verify -Djava.io.tmpdir="$RUNNER_TEMP"

     - name: Collect Grid logs
       if: always()
       run: |
           mkdir -p target/grid-logs
           docker compose ps --all > target/grid-logs/containers.txt
           docker compose logs --no-color > target/grid-logs/selenium-grid.log 2>&1

     - name: Upload reports, screenshots, and Grid logs
       if: always()
       uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
       with:
         name: selenium-grid-results
         path: |
             target/surefire-reports/
             target/screenprints/
             target/grid-logs/
         retention-days: 7

     - name: Stop Selenium Grid
       if: always()
       run: docker compose down --volumes --remove-orphans
